name = "welive-festival-website"
main = "worker.js"
compatibility_date = "2026-06-30"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
# Nur /api/* läuft zuerst durch den Worker; alles andere wird direkt als statische Datei geliefert.
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "welive-downloads"

[vars]
DOWNLOAD_KEY = "welive-booklet.pdf"

# Secrets (nicht hier eintragen):
#   npx wrangler secret put DOWNLOAD_SECRET   -> lange Zufallszeichenkette
#   npx wrangler secret put LEAD_WEBHOOK       -> z. B. Formspree-Endpoint-URL
